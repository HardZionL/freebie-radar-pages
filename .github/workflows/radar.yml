name: Radar cloud collection and Pages
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/initial-seed.json'
      - 'bootstrap/retail-refresh.json'
      - 'bootstrap/retail-leads-seed.json'
      - 'bootstrap/retail-leads-recheck.json'
      - 'bootstrap/smzdm-deals-feed-fix.json'
      - 'bootstrap/coupon-priority-seed.json'
      - 'bootstrap/coupon-ai-audit-2.json'
      - 'bootstrap/aws-official-now.json'
      - 'bootstrap/30min-rollout.json'
      - 'bootstrap/free-community-rollout.json'
  schedule:
    # Full sources every 2 hours; lightweight rounds in the other slots.
    - cron: '17 0,6,12,18 * * *'
    - cron: '17 2,4,8,10,14,16,20,22 * * *'
    # Every other half-hour is a lightweight incremental round.
    - cron: '17 1-23/2 * * *'
    - cron: '47 * * * *'
    # Daily digest, 20:30 Beijing = 12:30 UTC.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: One-time broader source scan and up to 72 AI decisions
        type: boolean
        default: false
      daily:
        description: Generate today's digest too (if not already generated)
        type: boolean
        default: false
concurrency:
  group: radar-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ZiChuanLan/freebie-radar
          ref: 9191745d6368ca34b89f436abe2df66b9dd17d6e
          path: _upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run offline checks
        run: |
          python3 -m unittest discover -s tests -v
          node --check scripts/collect.mjs
          node --check site/app.js
      - name: Install upstream dependencies
        working-directory: _upstream
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile --prod
      - name: Collect only selected sources, without AI credentials
        working-directory: _upstream
        env:
          NODE_ENV: production
          SITE_MODE: selfhost
          ENABLE_SCHEDULER: 'false'
          PUSH_CHANNEL: none
          AI_BASE_URL: ''
          AI_MODEL: ''
          AI_API_KEY: ''
          FETCH_TIMEOUT_MS: '15000'
          MAX_ITEMS_PER_RUN: '40'
          RADAR_BOOTSTRAP: ${{ (github.event_name == 'push' && contains(github.event.head_commit.added, 'bootstrap/initial-seed.json')) || inputs.bootstrap == true }}
          RADAR_RETAIL: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'aws-official-now') && !contains(github.event.head_commit.message, '30min-rollout') && !contains(github.event.head_commit.message, 'free-community-rollout') }}
          RADAR_QUICK: ${{ github.event.schedule == '17 1-23/2 * * *' || github.event.schedule == '47 * * * *' || (github.event_name == 'push' && contains(github.event.head_commit.message, '30min-rollout')) }}
          DATABASE_PATH: ${{ runner.temp }}/radar.db
        run: |
          cp ../scripts/collect.mjs ./radar-collect.mjs
          node --import tsx radar-collect.mjs "$RUNNER_TEMP/candidates.json"
      - name: Enrich public coupon and delivery candidates without credentials
        run: python3 scripts/collect_coupons.py "$RUNNER_TEMP/candidates.json"
      - name: Monitor official AWS AI announcements and current Quick trial terms
        if: ${{ github.event.schedule != '17 1-23/2 * * *' && github.event.schedule != '47 * * * *' }}
        run: python3 scripts/collect_official_ai.py "$RUNNER_TEMP/candidates.json"
      - name: Discover free community offers from HN and Product Hunt
        env:
          RADAR_QUICK: ${{ github.event.schedule == '17 1-23/2 * * *' || github.event.schedule == '47 * * * *' || (github.event_name == 'push' && contains(github.event.head_commit.message, '30min-rollout')) }}
        run: python3 scripts/collect_community.py "$RUNNER_TEMP/candidates.json"
      - name: Review only new candidates and generate safe public snapshot
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          MIMO_MODEL: ${{ vars.MIMO_MODEL }}
          DAILY: ${{ github.event.schedule == '30 12 * * *' || inputs.daily == true }}
          BOOTSTRAP: ${{ (github.event_name == 'push' && contains(github.event.head_commit.added, 'bootstrap/initial-seed.json')) || inputs.bootstrap == true }}
          RETAIL: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'aws-official-now') && !contains(github.event.head_commit.message, '30min-rollout') && !contains(github.event.head_commit.message, 'free-community-rollout') }}
          COUPON_BOOST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'coupon-ai-audit-2') }}
          LEADS_ONLY: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'coupon-ai-audit-2') && !contains(github.event.head_commit.message, 'aws-official-now') && !contains(github.event.head_commit.message, '30min-rollout') && !contains(github.event.head_commit.message, 'free-community-rollout') }}
          BUDGETED: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '30min-rollout') || contains(github.event.head_commit.message, 'free-community-rollout'))) }}
        run: |
          args=()
          if [[ "$DAILY" == "true" ]]; then args+=(--daily); fi
          if [[ "$BOOTSTRAP" == "true" ]]; then args+=(--bootstrap); fi
          if [[ "$RETAIL" == "true" ]]; then args+=(--retail); fi
          if [[ "$LEADS_ONLY" == "true" ]]; then args+=(--leads-only); fi
          if [[ "$COUPON_BOOST" == "true" ]]; then args+=(--coupon-boost); fi
          if [[ "$BUDGETED" == "true" ]]; then args+=(--budgeted); fi
          python3 scripts/review.py "$RUNNER_TEMP/candidates.json" "${args[@]}"
      - name: Upload only sanitized state and public snapshot
        uses: actions/upload-artifact@v4
        with:
          name: radar-snapshot
          path: |
            site/data.json
            state/reviewed.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: radar-snapshot
          path: snapshot
      - name: Save public snapshot and dedup state
        run: |
          cp snapshot/site/data.json site/data.json
          cp snapshot/state/reviewed.json state/reviewed.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json state/reviewed.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public resource radar'
            git push
          fi
      - name: Package versioned frontend
        run: python3 scripts/package_frontend.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static Pages
        id: deployment
        uses: actions/deploy-pages@v4
