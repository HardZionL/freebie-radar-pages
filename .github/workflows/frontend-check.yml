name: Editorial frontend checks
on:
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/radar.yml'
      - '.github/workflows/frontend-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and security checks
        run: |
          node --check site/app.js
          node --check tests/mobile-ui.cjs
          node tests/mobile-ui.cjs
          node --check scripts/collect.mjs
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/radar.yml').read_text()
          schedules=[s.strip() for s in w.splitlines() if 'cron: ' in s]
          assert len(schedules)==4,schedules
          assert any("07 * * * *" in s for s in schedules)
          assert any("22,52 * * * *" in s for s in schedules)
          assert any("37 * * * *" in s for s in schedules)
          assert "QUICK_REVIEW:" in w and "args+=(--quick)" in w
          assert 'collect_community.py' in w
          assert 'X_BEARER_TOKEN' not in w
          assert 'state/x_read_budget.json' not in w
          assert '--budgeted' in w
          print('Cadence, token isolation and conservative caps: PASS')
          PY
          python3 -m py_compile scripts/review.py scripts/collect_community.py scripts/collect_official_ai.py scripts/collect_xhs_index.py
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from xml.etree import ElementTree
          import re, json
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if 'id' in d:
                      assert d['id'] not in self.ids, d['id']
                      self.ids.add(d['id'])
                  assert not any(k.startswith('on') for k in d), 'inline handler'
          p = Page()
          p.feed(Path('site/index.html').read_text())
          js = Path('site/app.js').read_text()
          assert set(re.findall(r"\$\('([\w-]+)'\)",js)) <= p.ids
          assert 'innerHTML' not in js and 'eval(' not in js
          for f in Path('site/art').glob('*.svg'):
              ElementTree.parse(f)
          d = json.loads(Path('site/data.json').read_text())
          assert {'items','daily','shoppingLeads'} <= d.keys()
          assert not ({'sources','review'} & d.keys()), 'Operational telemetry is public'
          print('Syntax, DOM IDs, SVG and static snapshot checks passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-preview
          path: site
          retention-days: 7
